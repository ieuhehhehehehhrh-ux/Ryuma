#import <UIKit/UIKit.h>

static NSString *const kCreditText = @"@Ryum1a";
static NSString *const kLink = @"https://t.me/ryumahackff";

static UIWindow *FindKeyWindow(void) {
    for (UIScene *scene in UIApplication.sharedApplication.connectedScenes) {
        if (![scene isKindOfClass:UIWindowScene.class]) continue;
        for (UIWindow *w in ((UIWindowScene *)scene).windows) {
            if (w.isKeyWindow) return w;
        }
    }
    return nil;
}

static void ShowCredit(int attempt) {
    UIWindow *window = FindKeyWindow();
    if (!window) {
        if (attempt < 20) {
            dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1 * NSEC_PER_SEC)),
                           dispatch_get_main_queue(), ^{ ShowCredit(attempt + 1); });
        }
        return;
    }
    UIButton *btn = [UIButton buttonWithType:UIButtonTypeSystem];
    [btn setTitle:kCreditText forState:UIControlStateNormal];
    [btn setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
    btn.titleLabel.font = [UIFont boldSystemFontOfSize:12];
    [btn addAction:[UIAction actionWithHandler:^(__kindof UIAction *a) {
        [UIApplication.sharedApplication openURL:[NSURL URLWithString:kLink]
                                         options:@{} completionHandler:nil];
    }] forControlEvents:UIControlEventTouchUpInside];
    [btn sizeToFit];
    CGFloat top = window.safeAreaInsets.top + 2;
    btn.frame = CGRectMake(6, top, btn.frame.size.width + 12, 30);
    [window addSubview:btn];
}

__attribute__((constructor))
static void CreditInit(void) {
    dispatch_async(dispatch_get_main_queue(), ^{ ShowCredit(0); });
}
